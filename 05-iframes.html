<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conteúdo sobre o uso e aplicação de iframes no HTML.">
    <title>Sobre Iframe | HTML</title>
</head>
<body>
    <h1>O que é um Iframe?</h1>
    <p>Iframe significa <strong>inline frame</strong>.</p>
    <p>Ele permite que você <em>incorpore</em> outra página/documento dentro da sua própria página HTML.</p>
    <hr>

    <h2>Criando um iframe básico</h2>
    <iframe src="03-listas.html" frameborder="0" width="500" height="600"></iframe>

    <hr>
    <h2>Explorando outras formas de trabalhar com o Iframe</h2>
    <h3>Incorporando o Youtube</h3>

    <iframe 
    width="560" 
    height="315" 
    src="https://www.youtube.com/embed/8ysFkNYwhAE?si=Fy8EcQngn1P71W77" 
    title="YouTube video player" 
    frameborder="0" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; 
    picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h3>Incorporando um mapa no site</h3>

    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624.9899989217956!2d2.2899928888549903!3d48.8584011!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66fe1f3bfb4ad%3A0x7bd31375becf28cd!2sTorre%20Eiffel%2C%205%20Av.%20Anatole%20France%2C%2075007%20Paris%2C%20Fran%C3%A7a!5e0!3m2!1spt-BR!2sbr!4v1790213033361!5m2!1spt-BR!2sbr" 
    width="600" 
    height="450" 
    style="border:0;" 
    allowfullscreen="" 
    loading="lazy" 
    referrerpolicy="strict-origin-when-cross-origin"></iframe>


</body>
</html>
