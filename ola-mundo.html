<!-- DOCTYPE - Serve para informar ao navegador que estamos usando o HTML5. -->
<!DOCTYPE html>

<!-- HTML - É a tag principal da página. Tudo relacionado ao HTML fica dentro dessa tag. -->

<html lang="pt-br">
<!-- lang/language - É um atributo e serve para configurar/informar o idioma da página. Por padrão, vem configurado com "en"(english), mas pode ser configurado para o idioma de quem está escrevendo o documeto HTML. -->

<!-- head/ cabeça do documento - Essa área é responável por guardar informações sobre a página. Chamamos de área invisivel, pois somente algumas informações ficavam visiveis para o usuário, como por exemplo,o nome da página na aba do navegador, ou a descrição quando o usuário faz alguma busca. -->

<head>

    <!-- Essa metatag serve para informar ao navegador qual conjunto de caracters a página utiliza. Isso garante compatibilidade entre sistemas mais antigos, além de exibir da forma correta palavras com acentos e caracters especiais. -->
    <meta charset="UTF-8">

    <!-- Essa configuração serve para ajudar o navegador a entender como a página deve ser exibida de acordo com o tamanho da tela. Em resumo, ajuda a página a funcionar corretamente em diferentes tamanhos de tela. -->
    <meta name="viewport" content="width=, initial-scale=1.0">

    <!-- title/título - Serve para definir o título da página que aparece, por exemplo, na aba do navegador. -->
    <title>Olá mundo</title>

</head>

<body>
    Olá mundo. Este é o meu primeiro programa em HTML5.
</body>

</html>
